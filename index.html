<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>HPD Violations by Building</title>
  <meta property="og:title" content="HPD Violations by Building — NYC Housing Data" />
  <meta property="og:description" content="Which NYC building has the most housing violations? A live-data breakdown of the top 10." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://hpd-violations-chart-dominicarlequi.vercel.app" />
  <meta property="og:image" content="https://hpd-violations-chart-dominicarlequi.vercel.app/og-hpd.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
  <style>
    :root {
      --cream: #FAF7F2;
      --ink: #26392E;
      --sage: #7C9A82;
      --sage-light: #EAF0EA;
      --butter: #E3B23C;
      --clay: #A8402F;
      --clay-light: #F6E8E4;
      --stone: #6B6357;
      --hairline: #E2DACB;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
      background: var(--cream);
      color: var(--ink);
    }
    h2 {
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-weight: 400;
      font-size: 28px;
      margin-bottom: 4px;
    }
    p { color: var(--stone); margin-top: 0; }
    #dateRange, .section-subtext {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.8em;
      color: var(--stone);
    }
    #dateRange { margin-bottom: 16px; }
    .section-subtext { margin-bottom: 12px; }
    .chart-card {
      position: relative;
      background: #fff;
      border: 1px solid var(--hairline);
      border-radius: 6px;
      padding: 20px;
      margin: 12px 0;
    }
    .section-divider {
      border: none;
      border-top: 1px solid var(--hairline);
      margin: 28px 0;
    }
    .view-toggle {
      display: inline-flex;
      gap: 4px;
      background: var(--sage-light);
      border-radius: 8px;
      padding: 4px;
      margin-bottom: 16px;
    }
    .toggle-btn {
      font-family: 'DM Sans', system-ui, sans-serif;
      font-weight: 600;
      font-size: 13px;
      padding: 7px 14px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--stone);
      cursor: pointer;
    }
    .toggle-btn.active {
      background: var(--ink);
      color: var(--cream);
    }
    #searchForm {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }
    #buildingSearchInput {
      flex: 1;
      font-family: 'DM Sans', system-ui, sans-serif;
      font-size: 14px;
      padding: 10px 12px;
      border: 1px solid var(--hairline);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
    }
    #buildingSearchInput:disabled {
      background: var(--sage-light);
      color: var(--stone);
      cursor: not-allowed;
    }
    #buildingSearchButton {
      font-family: 'DM Sans', system-ui, sans-serif;
      font-weight: 600;
      font-size: 14px;
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      background: var(--ink);
      color: var(--cream);
      cursor: pointer;
    }
    #buildingSearchButton:disabled {
      background: var(--stone);
      cursor: not-allowed;
    }
    #searchError {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--clay-light);
      border: 1px solid var(--clay);
      border-radius: 6px;
      padding: 10px 12px;
      margin: 0 0 8px;
    }
    #searchErrorText {
      flex: 1;
      margin: 0;
      color: var(--clay);
      font-size: 0.85em;
    }
    #searchRetryButton {
      flex-shrink: 0;
      font-family: 'DM Sans', system-ui, sans-serif;
      font-weight: 600;
      font-size: 0.85em;
      padding: 6px 12px;
      border: 1px solid var(--clay);
      border-radius: 6px;
      background: transparent;
      color: var(--clay);
      cursor: pointer;
    }
    #searchRetryButton:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .chart-skeleton {
      position: absolute;
      inset: 20px;
      border-radius: 4px;
      background: var(--hairline);
      animation: skeleton-pulse 1.4s ease-in-out infinite;
    }
    @keyframes skeleton-pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <section id="buildingSearch">
    <h2>Search a Building</h2>
    <form id="searchForm">
      <input type="text" id="buildingSearchInput" placeholder="Enter a Building ID to see its violation history (e.g. 393321)" autocomplete="off" required />
      <button type="submit" id="buildingSearchButton">Search</button>
    </form>
    <div id="searchError" hidden>
      <p id="searchErrorText"></p>
      <button type="button" id="searchRetryButton" hidden>Retry</button>
    </div>
    <div class="chart-card">
      <div class="chart-skeleton" id="searchSkeleton" hidden></div>
      <canvas id="searchChart"></canvas>
    </div>
    <p id="searchResultText"></p>
  </section>

  <hr class="section-divider" />

  <section id="violationsOverview">
    <div class="view-toggle" role="tablist">
      <button type="button" class="toggle-btn active" id="viewByBuildingBtn" role="tab" aria-selected="true">By Building</button>
      <button type="button" class="toggle-btn" id="viewByBoroughBtn" role="tab" aria-selected="false">By Borough</button>
    </div>

    <div id="byBuildingPanel">
      <h2 id="summaryHeading">Loading top building...</h2>
      <p id="summarySubtext"></p>
      <p id="dateRange">Loading date range...</p>
      <div class="chart-card"><canvas id="myChart"></canvas></div>
      <p id="insightText">Loading...</p>
    </div>

    <div id="byBoroughPanel" hidden>
      <h2>Violation Severity by Borough</h2>
      <p class="section-subtext">Share of Class A (minor) to Class C (hazardous) violations by borough — live pull, last 5 years.</p>
      <div class="chart-card"><canvas id="boroughChart"></canvas></div>
      <p id="boroughInsightText">Loading...</p>
    </div>
  </section>

  <script>
    const APP_TOKEN = "JGurc4mbAlizJjvfgIeKc6Th2";
    const ENDPOINT = "https://data.cityofnewyork.us/resource/csn4-vhvf.json";
    // Class colors shared across charts: sage (minor) -> butter -> clay (hazardous)
    const classColors = { A: "#7C9A82", B: "#E3B23C", C: "#A8402F" };

    let buildingIds = [];
    let boroughs = [];
    let classCounts = { A: [], B: [], C: [] };
    let topChartInstance = null;
    let boroughChartInstance = null;

    function renderChart() {
      const labels = buildingIds.map((id, i) => [id, boroughs[i]]);

      topChartInstance = new Chart(document.getElementById('myChart'), {
        type: 'bar',
        data: {
          labels: labels,
          datasets: ['A', 'B', 'C'].map(c => ({
            label: `Class ${c}`,
            data: classCounts[c],
            backgroundColor: classColors[c]
          }))
        },
        options: {
          plugins: {
            legend: { display: true },
            tooltip: {
              callbacks: {
                footer: items => `Total: ${items.reduce((sum, item) => sum + item.parsed.y, 0)}`
              }
            }
          },
          scales: {
            y: { stacked: true, beginAtZero: true, title: { display: true, text: 'Violations' } },
            x: { stacked: true, title: { display: true, text: 'Building ID (Borough)' } }
          }
        }
      });
    }

    function renderBoroughChart(boroughClassCounts) {
      const boroughList = Object.keys(boroughClassCounts);
      const pct = {};
      boroughList.forEach(b => {
        const { A, B, C } = boroughClassCounts[b];
        const total = A + B + C;
        pct[b] = { A: A / total * 100, B: B / total * 100, C: C / total * 100 };
      });

      // Highest share of hazardous Class C violations first
      boroughList.sort((a, b) => pct[b].C - pct[a].C);

      boroughChartInstance = new Chart(document.getElementById('boroughChart'), {
        type: 'bar',
        data: {
          labels: boroughList,
          datasets: ['A', 'B', 'C'].map(c => ({
            label: `Class ${c}`,
            data: boroughList.map(b => pct[b][c]),
            backgroundColor: classColors[c]
          }))
        },
        options: {
          indexAxis: 'y',
          plugins: {
            legend: { display: true, position: 'bottom' },
            tooltip: {
              callbacks: {
                label: item => {
                  const b = item.label;
                  const c = ['A', 'B', 'C'][item.datasetIndex];
                  const raw = boroughClassCounts[b][c];
                  return `Class ${c}: ${item.parsed.x.toFixed(1)}% (${raw.toLocaleString()} violations)`;
                }
              }
            }
          },
          scales: {
            x: { stacked: true, max: 100, title: { display: true, text: '% of violations' } },
            y: { stacked: true }
          }
        }
      });

      const worst = boroughList[0];
      const best = boroughList[boroughList.length - 1];
      document.getElementById('boroughInsightText').textContent =
        `${worst} has the highest share of hazardous Class C violations at ${pct[worst].C.toFixed(1)}%, compared to ${pct[best].C.toFixed(1)}% in ${best}.`;
    }

    async function loadData() {
      const sinceDate = isoDateYearsAgo(5);
      const params = new URLSearchParams({
        "$$app_token": APP_TOKEN,
        "$select": "buildingid,boro,count(*) as violation_count",
        "$where": `inspectiondate >= '${sinceDate}'`,
        "$group": "buildingid,boro",
        "$order": "violation_count DESC",
        "$limit": "10"
      });

      const response = await fetch(`${ENDPOINT}?${params}`);
      const rows = await response.json();

      buildingIds = rows.map(row => row.buildingid);
      boroughs = rows.map(row => row.boro);

      // Date range covered by the violations behind these buildings, within the 5-year window
      const idList = buildingIds.map(id => `'${id}'`).join(',');
      const rangeParams = new URLSearchParams({
        "$$app_token": APP_TOKEN,
        "$select": "min(inspectiondate) as mindate, max(inspectiondate) as maxdate",
        "$where": `buildingid in(${idList}) AND inspectiondate >= '${sinceDate}'`
      });
      const rangeResponse = await fetch(`${ENDPOINT}?${rangeParams}`);
      const [range] = await rangeResponse.json();
      const fmt = d => new Date(d).toLocaleDateString('en-US', { year: 'numeric', month: 'short' });
      document.getElementById('dateRange').textContent =
        `Violations recorded ${fmt(range.mindate)} – ${fmt(range.maxdate)}`;

      // Class (A/B/C) breakdown for these same buildings, within the 5-year window
      const classParams = new URLSearchParams({
        "$$app_token": APP_TOKEN,
        "$select": "buildingid,class,count(*) as cnt",
        "$group": "buildingid,class",
        "$where": `buildingid in(${idList}) AND inspectiondate >= '${sinceDate}'`
      });
      const classResponse = await fetch(`${ENDPOINT}?${classParams}`);
      const classRows = await classResponse.json();

      classCounts = { A: [], B: [], C: [] };
      buildingIds.forEach(id => {
        ['A', 'B', 'C'].forEach(c => {
          const match = classRows.find(r => r.buildingid === id && r.class === c);
          classCounts[c].push(match ? Number(match.cnt) : 0);
        });
      });

      renderChart();

      const top = rows[0];
      document.getElementById('summaryHeading').textContent =
        `Building ${top.buildingid} (${top.boro}) has the most HPD violations in the dataset`;
      document.getElementById('summarySubtext').textContent =
        `${Number(top.violation_count).toLocaleString()} violations in the last 5 years`;

      const second = rows[1];
      const topCount = Number(top.violation_count);
      const secondCount = Number(second.violation_count);
      const percentDiff = Math.round(((topCount - secondCount) / secondCount) * 100);
      document.getElementById('insightText').textContent =
        `The gap at the top is the finding. Building ${top.buildingid} has ${topCount.toLocaleString()} violations — ${percentDiff}% more than the second-place building, ${second.buildingid}, at ${secondCount.toLocaleString()}. The remaining 9 buildings cluster within a tight range of each other.`;
    }

    async function loadBoroughSeverity() {
      const sinceDate = isoDateYearsAgo(5);
      const params = new URLSearchParams({
        "$$app_token": APP_TOKEN,
        "$select": "boro,class,count(*) as cnt",
        "$where": `inspectiondate >= '${sinceDate}'`,
        "$group": "boro,class"
      });
      const response = await fetch(`${ENDPOINT}?${params}`);
      const rows = await response.json();

      const boroughClassCounts = {};
      rows.forEach(row => {
        if (!['A', 'B', 'C'].includes(row.class)) return;
        if (!boroughClassCounts[row.boro]) boroughClassCounts[row.boro] = { A: 0, B: 0, C: 0 };
        boroughClassCounts[row.boro][row.class] = Number(row.cnt);
      });

      renderBoroughChart(boroughClassCounts);
    }

    let searchChartInstance = null;
    let lastSearchedBuildingId = null;

    function isoDateYearsAgo(years) {
      const d = new Date();
      d.setUTCFullYear(d.getUTCFullYear() - years);
      return d.toISOString().slice(0, 10);
    }

    function setSearchLoading(isLoading) {
      document.getElementById('buildingSearchInput').disabled = isLoading;
      document.getElementById('buildingSearchButton').disabled = isLoading;
      document.getElementById('searchRetryButton').disabled = isLoading;
      document.getElementById('searchSkeleton').hidden = !isLoading;
    }

    function showSearchError(message, { retryable }) {
      document.getElementById('searchErrorText').textContent = message;
      document.getElementById('searchError').hidden = false;
      document.getElementById('searchRetryButton').hidden = !retryable;
    }

    function hideSearchError() {
      document.getElementById('searchError').hidden = true;
    }

    function renderSearchChart(buildingId, counts) {
      const total = counts.A + counts.B + counts.C;

      if (searchChartInstance) {
        searchChartInstance.destroy();
        searchChartInstance = null;
      }

      if (total === 0) {
        document.getElementById('searchResultText').textContent =
          `No violations found for Building ${buildingId}.`;
        return;
      }

      searchChartInstance = new Chart(document.getElementById('searchChart'), {
        type: 'bar',
        data: {
          labels: ['Class A', 'Class B', 'Class C'],
          datasets: [{
            data: [counts.A, counts.B, counts.C],
            backgroundColor: [classColors.A, classColors.B, classColors.C]
          }]
        },
        options: {
          plugins: { legend: { display: false } },
          scales: { y: { beginAtZero: true, title: { display: true, text: 'Violations' } } }
        }
      });

      document.getElementById('searchResultText').textContent =
        `Building ${buildingId}: ${total.toLocaleString()} total violations.`;
    }

    async function performSearch(buildingId) {
      lastSearchedBuildingId = buildingId;
      hideSearchError();
      setSearchLoading(true);

      try {
        const sinceDate = isoDateYearsAgo(5);
        const params = new URLSearchParams({
          "$$app_token": APP_TOKEN,
          "$select": "class,count(*) as cnt",
          "$where": `buildingid='${buildingId}' AND inspectiondate >= '${sinceDate}'`,
          "$group": "class"
        });
        const response = await fetch(`${ENDPOINT}?${params}`);
        if (!response.ok) throw new Error(`Request failed with status ${response.status}`);
        const rows = await response.json();

        const counts = { A: 0, B: 0, C: 0 };
        rows.forEach(row => {
          if (Object.prototype.hasOwnProperty.call(counts, row.class)) {
            counts[row.class] = Number(row.cnt);
          }
        });

        renderSearchChart(buildingId, counts);
      } catch (err) {
        console.error('Building search failed:', err);
        showSearchError("Couldn't load this building's data. Try again.", { retryable: true });
      } finally {
        setSearchLoading(false);
      }
    }

    document.getElementById('searchForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const buildingId = document.getElementById('buildingSearchInput').value.trim();

      hideSearchError();

      if (!/^\d+$/.test(buildingId)) {
        showSearchError('Enter a numeric Building ID.', { retryable: false });
        return;
      }

      performSearch(buildingId);
    });

    document.getElementById('searchRetryButton').addEventListener('click', () => {
      if (lastSearchedBuildingId) performSearch(lastSearchedBuildingId);
    });

    function setView(view) {
      const isBuilding = view === 'building';
      document.getElementById('byBuildingPanel').hidden = !isBuilding;
      document.getElementById('byBoroughPanel').hidden = isBuilding;
      document.getElementById('viewByBuildingBtn').classList.toggle('active', isBuilding);
      document.getElementById('viewByBoroughBtn').classList.toggle('active', !isBuilding);
      document.getElementById('viewByBuildingBtn').setAttribute('aria-selected', String(isBuilding));
      document.getElementById('viewByBoroughBtn').setAttribute('aria-selected', String(!isBuilding));

      if (isBuilding && topChartInstance) topChartInstance.resize();
      if (!isBuilding && boroughChartInstance) boroughChartInstance.resize();
    }

    document.getElementById('viewByBuildingBtn').addEventListener('click', () => setView('building'));
    document.getElementById('viewByBoroughBtn').addEventListener('click', () => setView('borough'));

    loadData();
    loadBoroughSeverity();
  </script>
</body>
</html>
